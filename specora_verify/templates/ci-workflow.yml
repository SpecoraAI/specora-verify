# Specora Governance Verification Workflow
#
# Generated by: specora-verify certify scaffold
#
# This workflow verifies your integration against Specora governance standards.

name: Specora Governance Verification

on:
  push:
    branches: [main, master]
    paths:
      - "certification_bundle/**"
      - ".github/workflows/specora-governance.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "certification_bundle/**"
      - ".github/workflows/specora-governance.yml"
  workflow_dispatch:

env:
  CERTIFICATION_TIER: basic
  BUNDLE_PATH: ./certification_bundle

jobs:
  verify-vectors:
    name: Verify Golden Vectors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install specora-verify
        run: pip install specora-verify

      - name: Verify manifest vectors
        run: specora-verify vectors verify

      - name: Verify certification vectors
        run: specora-verify certify vectors verify

  certify:
    name: Certification Check
    runs-on: ubuntu-latest
    needs: [verify-vectors]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install specora-verify
        run: pip install specora-verify

      - name: Check certification bundle
        run: specora-verify certify check --tier ${{ env.CERTIFICATION_TIER }} --bundle ${{ env.BUNDLE_PATH }}

      - name: Upload verification report
        if: always()
        run: |
          specora-verify certify check --tier ${{ env.CERTIFICATION_TIER }} --bundle ${{ env.BUNDLE_PATH }} --format json > verification-report.json || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.json
