[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specora-verify"
version = "1.1.0"
description = "The independent verifier for AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Specora AI", email = "opensource@specora.ai"}
]
maintainers = [
    {name = "Specora AI", email = "opensource@specora.ai"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Archiving",
]
keywords = [
    "specora",
    "verification",
    "manifest",
    "proof",
    "audit",
    "ai-governance",
    "sigstore",
    "ed25519",
    "compliance",
]

# Core verification path is stdlib-only. All extras are optional.
dependencies = []

[project.optional-dependencies]
crypto = [
    "cryptography>=41.0.0",
    "PyNaCl>=1.5.0",
]
fetchers = [
    "httpx>=0.27.0",
    "dnspython>=2.4.0",
    "defusedxml>=0.7.1",
]
sigstore = [
    "sigstore>=3.0.0",
]
all = [
    "cryptography>=41.0.0",
    "PyNaCl>=1.5.0",
    "httpx>=0.27.0",
    "dnspython>=2.4.0",
    "defusedxml>=0.7.1",
    "sigstore>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "jsonschema>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "pip-audit>=2.7.0",
    "bandit[toml]>=1.7.0",
    "cryptography>=41.0.0",
    "PyNaCl>=1.5.0",
    "httpx>=0.27.0",
    "dnspython>=2.4.0",
    "defusedxml>=0.7.1",
    "types-defusedxml>=0.7.0",
    "sigstore>=3.0.0",
]

[project.scripts]
specora-verify = "specora_verify.cli:main"

[project.urls]
Homepage      = "https://specora.ai/"
Repository    = "https://github.com/SpecoraAI/specora-verify"
Documentation = "https://github.com/SpecoraAI/specora-verify#readme"
Issues        = "https://github.com/SpecoraAI/specora-verify/issues"
"Wire Spec"   = "https://spec.specora.ai/v1.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["specora_verify*"]

# Ship the golden vectors inside the wheel so `specora-verify vectors verify`
# works from a pip install (the CLI defaults to the bundled copy).
[tool.setuptools.package-data]
specora_verify = [
    "vectors/**/*.json",
    "vectors/**/*.txt",
    "vectors/**/*.b64",
    "vectors/**/*.pem",
    "vectors/**/*.md",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.bandit]
# Static security analysis (SAST). Run in CI as `bandit -c pyproject.toml -r
# specora_verify -ll` (medium severity and above).
#
# B608 (hardcoded_sql_expressions) is skipped project-wide: this codebase has
# no database and executes no SQL. The only B608 hits are false positives from
# Markdown headings ("Update…", "Set…") inside the f-string templates in
# scaffold.py. `# nosec` cannot be placed inside a triple-quoted string, so a
# documented skip is the surgical option that keeps every other check active.
skips = ["B608"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
